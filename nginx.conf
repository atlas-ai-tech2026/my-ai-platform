server {
  # DO App Platform expects 8080; locally docker-compose maps host→container 8080
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip static assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Reverse-proxy API calls to the backend container (Vite dev proxy is gone in prod)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Image/video generation can take a while
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 25m;
  }

  # Service-worker kill-switches must never be cached, so browsers re-fetch
  # them and pick up the self-unregistering version (clears stale SWs from
  # earlier builds that were serving cached old assets).
  location ~* ^/(sw|service-worker)\.js$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
    try_files $uri =404;
  }

  # File-looking paths (anything with an extension) must 404 when the file
  # doesn't exist — never fall back to index.html. Serving the SPA shell at
  # /sitemap1.xml etc. made SEO crawlers report phantom invalid sitemaps.
  # (Prod is Express single-process; this mirrors the same rule there.)
  location ~ \.[a-zA-Z0-9]+$ {
    try_files $uri =404;
  }

  # SPA fallback — every non-file route returns index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html gets a SHORT freshness lifetime (60s), never a long one. The
  # Docker image gives every file a fixed Last-Modified (1980), so a long-
  # lived 304 loop once served stale HTML pointing at dead JS bundles until
  # a hard refresh. max-age=60 is bounded and self-heals within a minute of
  # a deploy, while still giving responses an explicit cache lifetime.
  # (Mirrors the Express prod path in server/src/index.js.)
  location = /index.html {
    add_header Cache-Control "public, max-age=60, must-revalidate";
    etag off;
  }

  # Long cache for hashed assets (content-hashed filenames → safe to cache).
  # ^~ so this prefix wins over the file-extension regex location above —
  # otherwise assets would lose these cache headers.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
