# OpenCodeReview — automatic AI code review for the Voxel repo.
#
# Install: copy this file to .github/workflows/ocr-review.yml on your default
# branch (main), then add the secrets/variables listed below.
#
# Repo Settings -> Secrets and variables -> Actions
#   Secret    OCR_LLM_URL            https://api.anthropic.com/v1/messages
#   Secret    OCR_LLM_AUTH_TOKEN     sk-ant-...   (your Anthropic API key)
#   Variable  OCR_LLM_MODEL          claude-sonnet-5
#   Variable  OCR_LLM_USE_ANTHROPIC  true
#
# Custom Voxel rules live at .opencodereview/rule.json in the repo root and are
# picked up automatically — no extra input needed here.

name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/review')
            || startsWith(github.event.comment.body, '/open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

# H6 (security audit 2026-07-28): this used to be `pull_request_target`,
# which runs in the BASE repo context WITH access to secrets for any PR —
# including one opened from a fork by a stranger. Combined with an action
# pinned to a mutable branch that put the Anthropic API key one upstream
# push away from exposure.
#
# `pull_request` is correct here: every PR in this repo is opened from a
# branch of this same repo (verified across the full PR history), and
# same-repo PRs DO receive secrets under `pull_request`. Fork PRs now run
# without secrets — the review step simply won't run for them, which is the
# safe failure mode.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Least privilege: read the code, write PR review comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs on PR open/update, or when a collaborator comments "/review".
    if: |
      github.event_name == 'pull_request'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/review')
          || startsWith(github.event.comment.body, '/open-code-review')
        )
      )
    steps:
      # issue_comment events carry no PR refs, so resolve them via the API.
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        # Pinned to an immutable commit SHA (H6) — a tag can be moved.
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('title', pr.title);

      - name: Run OpenCodeReview
        # H6: was `@main` — a mutable branch. ANY push to that third-party
        # repo would have executed here with our Anthropic API key in scope.
        # Pinned to the v1.8.4 release commit. To upgrade: check the repo's
        # releases, then replace this SHA and the version comment together.
        uses: alibaba/open-code-review@e78474478f168a8009bd3b12334a87a2c985819d # v1.8.4
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_auth_header: x-api-key
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          language: English
          llm_extra_body: '{}'
          # Give the reviewer the PR title as context (works for both triggers).
          background: ${{ steps.pr-context.outputs.title || github.event.pull_request.title }}
          # Keep one summary comment updated in place instead of spamming the PR.
          sticky_summary: 'true'
          # On a re-push, only add comments that don't repeat an existing one.
          incremental: 'true'
          review_concurrency: 5
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
